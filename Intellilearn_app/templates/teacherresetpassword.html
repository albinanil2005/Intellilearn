<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliLearn - Reset Teacher Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e40af;
            --teacher-color: #c29b40; /* Gold Theme */
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--primary-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .reset-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            padding: 40px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .logo { 
            font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); 
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; text-decoration: none;
        }
        .logo i { color: var(--primary-blue); }
        
        h1 { font-size: 1.6rem; color: var(--primary-dark); margin-bottom: 10px; }
        p { color: #64748b; font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--primary-dark); }
        
        input {
            width: 100%; padding: 12px 15px; border-radius: 8px;
            border: 1px solid var(--border-color); background: var(--bg-light);
            font-family: 'Inter', sans-serif; font-size: 0.95rem;
            outline: none; transition: all 0.3s;
        }
        input:focus {
            border-color: var(--teacher-color); background: var(--white);
            box-shadow: 0 0 0 3px rgba(194, 155, 64, 0.2);
        }

        .btn-submit {
            width: 100%; background-color: var(--teacher-color); color: white;
            padding: 14px; border: none; border-radius: 50px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); background-color: #a37f30; box-shadow: 0 5px 15px rgba(194, 155, 64, 0.3); }

        .error-msg { 
            background: #fff7ed; color: #c2410c; padding: 10px; border-radius: 8px; 
            font-size: 0.9rem; margin-bottom: 20px; border: 1px solid #ffedd5;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <a href="#" class="logo"><i class="fas fa-graduation-cap"></i> IntelliLearn</a>
        <h1>Reset Teacher Password</h1>
        <p style="margin-bottom: 30px;">Create a new secure password for your teacher account.</p>

        {% if messages %}
            {% for message in messages %}
            <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>
    </div>

</body>
</html>
