<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - IntelliLearn</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --primary-dark: #0f172a;
            --primary-blue: #2563EB; /* Active profile + Back button color */
            --text-main: #1f2937;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --danger: #ef4444; 
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 24px;
            box-shadow: var(--shadow-sm); z-index: 10;
        }

        .logo-container { display: flex; align-items: center; margin-bottom: 40px; padding-left: 5px; }
        .logo-text { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-text i { color: var(--primary-blue); }

        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--text-muted); text-decoration: none; border-radius: var(--radius-md);
            transition: all 0.2s ease; font-weight: 500;
        }
        .nav-item:hover { background-color: #f1f5f9; color: var(--primary-blue); }
        .nav-item.active { background-color: var(--primary-blue); color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); }

        /* Back Button Styling (outlined to filled on hover) */
        .back-button {
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            background-color: transparent;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .back-button:hover {
            background-color: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-body); }

        header {
            height: 80px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; background: var(--bg-card);
        }

        .header-title { font-size: 20px; font-weight: 600; color: var(--primary-dark); }

        .edit-body { 
            padding: 40px; 
            overflow-y: auto; 
            display: flex; 
            justify-content: center;
            flex: 1; 
        }

        /* --- FORM CARD --- */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 700px;
            padding: 32px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 40px; 
            height: fit-content; /* Ensures it grows with content */
        }

        .form-header { margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
        .form-header h2 { font-size: 22px; margin-bottom: 8px; color: var(--primary-dark); font-weight: 700; }
        .form-header p { color: var(--text-muted); font-size: 14px; }

        /* Avatar Section */
        .avatar-edit-section { display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        .change-photo-btn {
            background: white; color: var(--primary-blue); border: 1px solid var(--primary-blue);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: all 0.2s;
        }
        .change-photo-btn:hover { background: #eff6ff; }

        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .full-width { grid-column: span 2; }

        label { font-size: 13px; font-weight: 600; color: var(--primary-dark); }

        input, select {
            background-color: #f8fafc; border: 1px solid var(--border-color);
            padding: 12px; border-radius: 8px; color: var(--primary-dark);
            font-size: 14px; outline: none; transition: all 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); background: white; }

        /* Action Buttons */
        .action-buttons {
            display: flex; justify-content: flex-end; gap: 16px; margin-top: 32px; 
            padding-top: 24px; border-top: 1px solid var(--border-color);
        }

        .btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid transparent; }
        .btn-cancel:hover { color: var(--primary-dark); background: #f1f5f9; }
        .btn-save { background: var(--primary-dark); color: white; border: none; }
        .btn-save:hover { background: var(--primary-blue); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-container">
            <a href="#" class="logo-text">
                <i class="fas fa-graduation-cap"></i>
                IntelliLearn
            </a>
        </div>
        <ul class="nav-menu">
            <!-- Back Button (blue outlined, fills on hover) -->
            <li><a href="javascript:history.back()" class="nav-item back-button"><span> < </span> Back</a></li>
            <li><a href="/studentprofile/" class="nav-item active"><span>👤</span> My Profile</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <h2 class="header-title">Edit Profile</h2>
        </header>

        <div class="edit-body">
            <div class="form-card">
                <div class="form-header">
                    <h2>Edit Personal Info</h2>
                    <p>Update your personal details and public profile.</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="avatar-edit-section">
                        <div class="avatar-preview">
                            <img src="{{ edit.image.url }}" alt="Profile">
                        </div>
                        <div style="position: relative;">
                            <label for="file-upload" class="change-photo-btn">Change Photo</label>
                            <input id="file-upload" type="file" name="image" style="display: none;">
                            <div style="font-size: 11px; color: #64748b; margin-top: 6px;"></div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" value="{{edit.name}}">
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" value="{{edit.email}}">
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="number" name="phone" value="{{edit.phone}}">
                        </div>

                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" name="age" value="{{edit.age}}">
                        </div>

                        <div class="form-group">
                            <label>Current Grade</label>
                            <select name="currenteducation" value="{{edit.currenteducation}}" default="{{ edit.currenteducation }}" required>
                                <option value="{{ edit.currenteducation }}" selected>{{ edit.currenteducation }}</option>
                                <option value="8th Grade">8th Grade</option>
                                <option value="9th Grade">9th Grade</option>
                                <option value="10th Grade">10th Grade</option>
                                <option value="11th Grade">11th Grade</option>
                                <option value="12th Grade">12th Grade</option>
                                <option value="Undergrad 1st Year">Undergrad 1st Year</option>
                                <option value="Undergrad 2nd Year">Undergrad 2nd Year</option>
                                <option value="Undergrad 3rd Year">Undergrad 3rd Year</option>
                                <option value="Undergrad 4th Year">Undergrad 4th Year</option>
                                <option value="Graduate">Graduate</option>
                            </select>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <a href="{% url 'studentprofile' %}" class="btn btn-cancel">Cancel</a>
                        <button type="submit" class="btn btn-save">Save Changes</button>
                    </div>

                </form>
            </div>
        </div>
    </main>
</body>
</html>
